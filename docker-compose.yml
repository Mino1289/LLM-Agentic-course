services:
  bootstrap:
    image: finance-rag:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-rag-bootstrap
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env
    command: ["/bin/bash", "scripts/bootstrap.sh"]
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: "no"

  finance-rag-api:
    image: finance-rag:latest
    container_name: finance-rag-api
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://finance-rag-web:3000
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped

  finance-rag-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://finance-rag-api:8000
    container_name: finance-rag-web
    depends_on:
      - finance-rag-api
    ports:
      - "3000:3000"
    environment:
      - API_PROXY_TARGET=http://finance-rag-api:8000
    restart: unless-stopped
