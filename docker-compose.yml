services:
  bootstrap:
    image: finance-rag:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-rag-bootstrap
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env
    command: ["/bin/bash", "scripts/bootstrap.sh"]
    volumes:
      - ./data:/app/data
      - ./rag/processed_data:/app/rag/processed_data
      - ./rag/chroma_db:/app/rag/chroma_db
    restart: "no"

  finance-rag-ui:
    image: finance-rag:latest
    container_name: finance-rag-ui
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./rag/processed_data:/app/rag/processed_data
      - ./rag/chroma_db:/app/rag/chroma_db
    restart: unless-stopped
